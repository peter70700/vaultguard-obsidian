name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled-readiness:
    if: github.event_name == 'schedule' && github.repository == 'peter70700/vaultguard-obsidian-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install nested dependencies
        run: npm run setup:test-deps

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix infrastructure audit --omit=dev --audit-level=high
          npm --prefix admin-panel audit --omit=dev --audit-level=high
          npm --prefix landing audit --omit=dev --audit-level=high
          npm --prefix share-bridge audit --omit=dev --audit-level=high

      - name: Check public export drift (read-only)
        run: npm run check:public-drift

      # The API host comes from a repository variable, never a literal. This
      # file is exported verbatim into the public monorepo (D-40), where the
      # export validator hard-fails on any production identifier in workflow
      # YAML. The job is private-repo + schedule only, so the variable is only
      # ever read here. The emptiness guard is load-bearing: the test body is
      # `describe.skipIf(!API_URL)`, so an unset variable would turn this step
      # into a silent green no-op rather than a failure.
      - name: Check public API routes (read-only verbs only)
        env:
          API_URL: ${{ vars.READINESS_API_URL }}
          LIVE_ROUTE_READ_ONLY_ONLY: "true"
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ]; then
            echo "::error::vars.READINESS_API_URL is not set — the live-route readiness check would silently skip."
            exit 1
          fi
          npx vitest run tests/live-route-check.test.ts

  forbidden-artifacts:
    # Standalone and intentionally independent of the build jobs. The regex
    # handles both the private flat layout and the exported public monorepo.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse Terraform state/plan/dev-tfvars in tree
        run: |
          set -euo pipefail
          # (^|/)terraform/ — NOT ^terraform/. This file is exported verbatim into
          # the public monorepo where terraform lives at packages/server/terraform/,
          # so an apex-anchored regex would never match a nested path and the guard
          # would be inert (RL2). The `/`-alternative catches the nested path; the
          # `^`-alternative still catches a root-level terraform/ (private repo).
          forbidden_regex='(^|/)terraform/(.*\.tfstate(\.[^/]+)?$|tfplan$|.*\.tfplan$|terraform\.tfvars$|.*\.auto\.tfvars$|\.terraform/|\.terraform\.tfstate\.lock\.info$)'
          violations="$(git ls-files | grep -E "$forbidden_regex" || true)"
          if [[ -n "$violations" ]]; then
            echo "::error::Tracked Terraform state/plan/dev-tfvars artifacts found:"
            printf '%s\n' $violations | while read -r f; do echo "::error file=$f::forbidden artifact tracked in git"; done
            exit 1
          fi
          echo "OK: no forbidden Terraform artifacts in tree."

  terraform-validate:
    # Standalone, like forbidden-artifacts. Nothing in CI parsed the Terraform
    # before this job, so a configuration that could not even `terraform
    # validate` sat on the branch undetected: a for_each'd integration was
    # referenced as `.id` without an instance key, which fails the whole
    # configuration. That defect is invisible to Vitest (the test suite reads
    # the .tf files as TEXT) and only surfaces at apply time — i.e. during a
    # deploy, which is the worst moment to discover it.
    #
    # `validate` needs a provider schema, so `init -backend=false` runs first:
    # it downloads providers without touching remote state and needs no AWS
    # credentials, keeping this job safe to run on every push.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Locate Terraform root
        id: tfroot
        run: |
          set -euo pipefail
          # Like the forbidden-artifacts regex above, this must handle BOTH
          # layouts: this file is copied verbatim into the public monorepo
          # (export-public-monorepo.mjs), where terraform lives at
          # packages/server/terraform/ rather than terraform/. Hardcoding the
          # private path would make the exported job fail on a missing
          # directory — the recurring "works privately, breaks on export" trap.
          for candidate in terraform packages/server/terraform; do
            if [[ -f "$candidate/main.tf" ]]; then
              echo "dir=$candidate" >> "$GITHUB_OUTPUT"
              echo "Terraform root: $candidate"
              exit 0
            fi
          done
          echo "::error::No Terraform root found (looked for terraform/ and packages/server/terraform/)"
          exit 1

      - name: Terraform fmt
        working-directory: ${{ steps.tfroot.outputs.dir }}
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: ${{ steps.tfroot.outputs.dir }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ steps.tfroot.outputs.dir }}
        run: terraform validate

  private-build-test-lint:
    # The private source repo has a flat root plus nested infrastructure and
    # admin-panel packages. Keep its authoritative verifier here instead of in
    # the public drift monitor so CI remains meaningful even when the public
    # sync credential is unavailable.
    if: github.repository == 'peter70700/vaultguard-obsidian-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infrastructure/package-lock.json
            admin-panel/package-lock.json
            landing/package-lock.json
            share-bridge/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install nested test dependencies
        run: npm run setup:test-deps

      - name: Verify private repo
        run: npm run verify

      - name: Build infrastructure workspace
        run: npm --prefix infrastructure run build

      - name: Build admin panel workspace
        run: npm --prefix admin-panel run build

      - name: Build landing workspace
        run: npm --prefix landing run build

      - name: Build share bridge workspace
        run: npm --prefix share-bridge run build

  build-test-lint:
    # The job body targets the public monorepo's packages/{plugin,server}/
    # layout. This file is the single source of truth (CONTEXT.md D-40) and
    # is copied verbatim into the monorepo via export-public-monorepo.mjs.
    #
    # On THIS private repo the layout is flat (root package.json, src/,
    # infrastructure/) — the monorepo paths don't exist, so running these
    # steps here would always fail. The `if:` guard selects the public job;
    # private-build-test-lint above covers the flat source layout instead.
    if: github.repository != 'peter70700/vaultguard-obsidian-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: SBOM smoke check
        run: npm sbom --sbom-format=cyclonedx --json > /tmp/vaultguard-sbom.cdx.json

      - name: Lint (Biome)
        run: npx biome check .

      - name: Typecheck (plugin)
        run: npx tsc -p packages/plugin/tsconfig.json --noEmit

      # The server lambda code lives at packages/server/infrastructure/ — one
      # level below the workspace boundary (packages/server/ has no package.json
      # of its own). Workspace install at the root does NOT reach into
      # packages/server/infrastructure/, so its devDependencies (@types/node,
      # @types/aws-lambda, typescript) aren't on disk before this step. Run a
      # local install inside packages/server/infrastructure to populate them.
      - name: Install server (infrastructure) deps
        working-directory: packages/server/infrastructure
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck (server)
        run: npx tsc -p packages/server/infrastructure/tsconfig.json --noEmit

      - name: Test (Vitest)
        run: npm run -w vaultguard-sync test
