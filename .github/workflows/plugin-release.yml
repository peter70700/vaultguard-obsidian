name: Release Plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # This workflow is copied verbatim into the public monorepo, where the
    # plugin lives at packages/plugin/. Skip private-repo tags so a maintainer
    # cannot accidentally publish from the wrong checkout layout.
    if: github.repository == 'peter70700/vaultguard-obsidian'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          const manifest = require("./packages/plugin/manifest.json");
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== manifest.version) {
            throw new Error(`Release tag ${tag} must match manifest.json version ${manifest.version}`);
          }
          NODE

      - name: Lint (defensive)
        run: npx biome check .

      - name: Test
        run: npm run -w vaultguard-sync test

      - name: Build plugin
        run: npm run -w vaultguard-sync build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            packages/plugin/main.js
            packages/plugin/manifest.json
            packages/plugin/styles.css

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            packages/plugin/main.js
            packages/plugin/manifest.json
            packages/plugin/styles.css
